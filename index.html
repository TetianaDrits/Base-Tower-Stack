<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><title>Base Stack</title>
<style>
  body { background: #0b111e; color: #fff; font-family: sans-serif; text-align: center; }
  #board { width: 300px; height: 400px; background: #161f30; margin: 10px auto; position: relative; overflow: hidden; border: 2px solid #0052FF; }
  .block { position: absolute; height: 25px; background: #0052FF; border: 1px solid #fff; }
</style>
</head>
<body>
<h1>Base Chain Stacker</h1>
<p>Жми Пробел или Кликай, чтобы вовремя ставить блоки!</p>
<h2>Стек: <span id="lvl">0</span></h2>
<div id="board"></div>
<script>
  let lvl = 0, dir = 3, w = 120, prevX = 90, curX = 0, active = true;
  const board = document.getElementById('board');
  function addBlock() {
    const b = document.createElement('div');
    b.className = 'block'; b.style.width = w + 'px';
    b.style.bottom = (lvl * 25) + 'px'; b.id = 'b' + lvl;
    board.appendChild(b);
  }
  addBlock();
  setInterval(() => {
    if(!active) return;
    curX += dir; if(curX > 300 - w || curX < 0) dir = -dir;
    document.getElementById('b' + lvl).style.left = curX + 'px';
  }, 20);
  window.onclick = window.onkeydown = () => {
    if(!active) return;
    if(lvl > 0) {
      let diff = curX - prevX;
      w -= Math.abs(diff);
      if(w <= 0) { alert('Цепь оборвалась! Высота: ' + lvl); active = false; location.reload(); return; }
    }
    prevX = curX; lvl++; document.getElementById('lvl').innerText = lvl; addBlock();
  };
</script>
</body>
</html>
